name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  chrome-extension:
    name: Chrome and Firefox extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install test tools
        run: cd chrome-extension && npm ci --no-audit --no-fund
      - name: Unit tests
        run: cd chrome-extension && npm test
      - name: Syntax check
        run: cd chrome-extension && npm run check
      - name: Build browser packages
        run: cd chrome-extension && npm run build
      - name: Validate Firefox package
        run: cd chrome-extension && npm run lint:firefox
      - name: Install browser runtimes
        run: cd chrome-extension && npx playwright install --with-deps --no-shell chromium firefox
      - name: Chrome end-to-end tests
        run: cd chrome-extension && npm run test:e2e
        env:
          EXTENSION_PATH: dist/chrome
      - name: Install Firefox WebDriver
        run: bash chrome-extension/scripts/install-geckodriver.sh "$RUNNER_TEMP/shorthand-geckodriver"
      - name: Firefox end-to-end tests
        run: cd chrome-extension && npm run test:e2e:firefox
        env:
          GECKODRIVER_PATH: ${{ runner.temp }}/shorthand-geckodriver/geckodriver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actle-browser-packages
          path: chrome-extension/dist/*.zip

  windows:
    name: Windows app build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build windows/ShorthandExpander.sln -c Release
      - name: Logic tests
        run: dotnet run --project windows/ShorthandExpander.Tests -c Release
      - name: Publish single-file exe
        run: dotnet publish windows/ShorthandExpander -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShorthandExpander-windows
          path: publish/ShorthandExpander.exe

  android:
    name: Android app build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Unit tests
        run: cd android && ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShorthandExpander-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
