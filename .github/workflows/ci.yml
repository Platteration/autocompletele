name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  chrome-extension:
    name: Chrome extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Unit tests
        run: cd chrome-extension && npm test
      - name: Syntax check
        run: cd chrome-extension && npm run check
      - name: Install Playwright and Chromium
        run: cd chrome-extension && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: cd chrome-extension && npm run test:e2e

  windows:
    name: Windows app build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build windows/ShorthandExpander.sln -c Release
      - name: Logic tests
        run: dotnet run --project windows/ShorthandExpander.Tests -c Release
      - name: Publish single-file exe
        run: dotnet publish windows/ShorthandExpander -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShorthandExpander-windows
          path: publish/ShorthandExpander.exe

  android:
    name: Android app build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Unit tests
        run: cd android && ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShorthandExpander-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
