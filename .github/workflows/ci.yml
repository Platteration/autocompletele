name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  chrome-extension:
    name: Chrome extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: cd chrome-extension && npm test
      - name: Syntax check
        run: cd chrome-extension && npm run check
      - name: Install Playwright and Chromium
        run: cd chrome-extension && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: cd chrome-extension && npm run test:e2e

  windows:
    name: Windows app build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build windows/ShorthandExpander.sln -c Release
      - name: Logic tests
        run: dotnet run --project windows/ShorthandExpander.Tests -c Release
      - name: Publish single-file exe
        run: dotnet publish windows/ShorthandExpander -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ShorthandExpander-windows
          path: publish/ShorthandExpander.exe

  android:
    name: Android app build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: cd android && ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShorthandExpander-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
