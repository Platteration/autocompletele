name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  chrome-extension:
    name: Chrome and Firefox extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install test tools
        run: cd chrome-extension && npm ci --no-audit --no-fund
      - name: Unit tests
        run: cd chrome-extension && npm test
      - name: Syntax check
        run: cd chrome-extension && npm run check
      - name: Build browser packages
        run: cd chrome-extension && npm run build
      - name: Validate Firefox package
        run: cd chrome-extension && npm run lint:firefox
      - name: Install browser runtimes
        run: cd chrome-extension && npx playwright install --with-deps --no-shell chromium firefox
      - name: Chrome end-to-end tests
        run: cd chrome-extension && npm run test:e2e
        env:
          EXTENSION_PATH: dist/chrome
      - name: Install Firefox WebDriver
        run: bash chrome-extension/scripts/install-geckodriver.sh "$RUNNER_TEMP/shorthand-geckodriver"
      - name: Firefox end-to-end tests
        run: cd chrome-extension && npm run test:e2e:firefox
        env:
          GECKODRIVER_PATH: ${{ runner.temp }}/shorthand-geckodriver/geckodriver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actle-browser-packages
          path: chrome-extension/dist/*.zip

  windows:
    name: Windows app build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build windows/ShorthandExpander.sln -c Release
      - name: Logic tests
        run: dotnet run --project windows/ShorthandExpander.Tests -c Release
      - name: Publish single-file exe
        run: dotnet publish windows/ShorthandExpander -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShorthandExpander-windows
          path: publish/ShorthandExpander.exe

  android:
    name: Android app build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # "true" when the Play upload key secrets exist (secrets cannot be read in a step's if).
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Unit tests
        run: cd android && ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: cd android && ./gradlew --no-daemon lintRelease
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Restore the Play upload key
        # Optional. Add the repository secrets ANDROID_KEYSTORE_BASE64 (base64 of the .jks),
        # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to get a
        # signed bundle; without them the bundle below is built unsigned.
        if: ${{ env.HAS_UPLOAD_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/upload-key.jks
      - name: Build release bundle (AAB)
        env:
          KEYSTORE_FILE: ${{ env.HAS_UPLOAD_KEY == 'true' && 'upload-key.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShorthandExpander-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShorthandExpander-android-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ShorthandExpander-android-lint
          path: android/app/build/reports/lint-results-release.html
