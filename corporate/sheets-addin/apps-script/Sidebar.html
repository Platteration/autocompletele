<!DOCTYPE html>
<!--
  actle Sheets sidebar for Google Sheets. The two includes are generated by
  `node build.js` (sheets-core.html holds the core bundle, pane.html the
  shared pane with its styles); push them with this file and Code.gs.
-->
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include("sheets-core"); ?>
  <?!= include("pane"); ?>
</head>
<body>
  <div id="pane"></div>
  <script>
    (function () {
      "use strict";
      var MAX_ROWS = 5000;    // rows of one column read per refresh
      var POLL_MS = 2000;     // a sidebar gets no selection events, so it asks

      function call(name) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          var runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(function (error) { reject(new Error((error && error.message) || String(error))); });
          runner[name].apply(runner, args);
        });
      }

      var bridge = {
        readContext: function () { return call("getActiveCellContext", MAX_ROWS); },
        writeValue: function (target, value) { return call("writeValue", target, value); },
        writeRows: function (target, rows) { return call("writeRows", target, rows); },
        writeFormula: function (target, formula) { return call("writeFormula", target, formula); },
        loadConfig: function () { return call("loadConfig"); },
        saveConfig: function (text) { return call("saveConfig", text); },
        onSelectionChanged: function (handler) {
          // One request in flight at a time: a tick that fires while the last answer is still on its way is skipped.
          var busy = false;
          setInterval(function () {
            if (busy) return;
            busy = true;
            Promise.resolve().then(handler).then(function () { busy = false; }, function () { busy = false; });
          }, POLL_MS);
        },
      };
      var storage = null;
      try { storage = window.localStorage; } catch (error) { storage = null; }
      var pane = window.ActleSheetsPane.createPane({ document: document, root: document.getElementById("pane"), core: window.ActleSheets, storage: storage, bridge: bridge });
      pane.start().catch(function (error) {
        document.getElementById("pane").textContent = "actle Sheets could not start: " + ((error && error.message) || error);
      });
    })();
  </script>
</body>
</html>
