<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Insert a note</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="popover">
  <h1 id="title">Insert a note</h1>
  <p class="path" id="hint"></p>
  <form id="form">
    <div id="blanks"></div>
  </form>
  <p class="hint" id="error" role="alert"></p>
  <div class="actions">
    <button class="plain" type="button" id="cancel">Cancel</button>
    <button class="primary" type="submit" form="form" id="insert">Insert</button>
  </div>
  <script src="notes-fill.js"></script>
</body>
</html>
