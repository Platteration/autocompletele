<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shorthand Autofill</title>
  <style>
    body { margin: 0; padding: 14px; width: 240px; font: 13px/1.5 system-ui, sans-serif; color: #1f2937; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #f3f4f6; background: #1f2937; } }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
    .muted { color: #6b7280; font-size: 12px; margin: 8px 0; }
    button { width: 100%; margin-top: 8px; padding: 6px; font: inherit; border-radius: 6px; border: 1px solid #2563eb; background: #2563eb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Shorthand Autofill</h1>
  <label><input type="checkbox" id="enabled"> Enabled everywhere</label>
  <label><input type="checkbox" id="site"> Enabled on <span id="host">this site</span></label>
  <p class="muted" id="count"></p>
  <button id="options">Manage shorthands</button>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
