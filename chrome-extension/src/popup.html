<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorthand Autofill</title>
  <style>
    :root { color-scheme: light dark; --bg:#f8fafc; --panel:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#4f46e5; --soft:#eef2ff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --panel:#111827; --text:#f8fafc; --muted:#94a3b8; --line:#334155; --accent:#818cf8; --soft:#1e1b4b; } }
    * { box-sizing:border-box; }
    body { margin:0; width:360px; min-height:420px; padding:14px; font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text); background:var(--bg); }
    .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    h1 { font-size:15px; margin:0; letter-spacing:-.01em; }
    .status { padding:3px 8px; border-radius:999px; font-size:11px; font-weight:700; color:var(--accent); background:var(--soft); }
    .search { position:relative; margin-bottom:10px; }
    .search input { width:100%; padding:9px 34px 9px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--text); font:inherit; outline:none; }
    .search input:focus { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); }
    .key { position:absolute; right:9px; top:8px; color:var(--muted); font-size:11px; }
    #results { display:grid; gap:6px; max-height:218px; overflow:auto; padding:1px; }
    .result { width:100%; text-align:left; border:1px solid var(--line); border-radius:9px; padding:8px 9px; background:var(--panel); color:var(--text); cursor:pointer; }
    .result:hover,.result:focus { border-color:var(--accent); outline:none; }
    .result-head { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .trigger { font:700 12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); }
    .copy { color:var(--muted); font-size:11px; }
    .expansion { margin-top:3px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .empty { color:var(--muted); text-align:center; padding:22px 8px; }
    .divider { height:1px; background:var(--line); margin:12px 0; }
    .toggles { display:grid; gap:8px; }
    label { display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; }
    label span:first-child { min-width:0; }
    .sub { display:block; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:250px; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:12px; }
    .muted { color:var(--muted); font-size:11px; }
    button.link { border:0; padding:4px 0; background:transparent; color:var(--accent); font:600 12px/1.2 inherit; cursor:pointer; }
    #toast { min-height:18px; margin-top:8px; color:var(--accent); font-size:11px; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Shorthand Autofill</h1>
    <span class="status" id="status">Ready</span>
  </div>

  <div class="search">
    <input id="search" type="search" placeholder="Find a shorthand…" autocomplete="off" autofocus>
    <span class="key">↵ copy</span>
  </div>
  <div id="results" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <div class="divider"></div>

  <div class="toggles">
    <label>
      <span>Expansion <small class="sub">Across Chrome</small></span>
      <input type="checkbox" id="enabled">
    </label>
    <label>
      <span>This site <small class="sub" id="host">Current page</small></span>
      <input type="checkbox" id="site">
    </label>
  </div>

  <div class="footer">
    <span class="muted" id="count"></span>
    <button class="link" id="options">Manage library →</button>
  </div>

  <script src="storage.js"></script>
  <script src="palette.js"></script>
  <script src="popup.js"></script>
</body>
</html>
