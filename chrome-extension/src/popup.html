<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>actle</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f6f8; --panel:#fff; --text:#172033; --muted:#526078; --line:#d7deea; --control:#7d8ba1; --accent:#2357d7; --soft:#eaf0ff; --pressed:#dce6ff; --danger:#b42332; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1320; --panel:#151d2c; --text:#eef2f7; --muted:#a7b4c8; --line:#344159; --control:#7f8da5; --accent:#a4bdff; --soft:#233354; --pressed:#30446c; --danger:#ff9da7; } }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; width:360px; min-height:420px; padding:0; font:13px/1.45 var(--font, system-ui,-apple-system,"Segoe UI",sans-serif); color:var(--text); background:var(--bg); }
    .popup-content { min-height:420px; max-height:600px; overflow-y:auto; padding:16px; scroll-padding:32px; scrollbar-width:thin; scrollbar-color:var(--control) var(--bg); }
    .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
    .brand { display:flex; align-items:center; min-width:0; gap:9px; }
    .brand img { width:32px; height:32px; flex:none; }
    h1 { font-size:15px; margin:0; letter-spacing:-.02em; font-family:var(--font-heading, inherit); }
    .tagline { margin:2px 0 0; color:var(--muted); font-size:11px; }
    .status { flex:none; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700; color:var(--accent); background:var(--soft); }
    .status[data-state="paused"] { color:var(--muted); background:var(--panel); border:1px solid var(--control); }
    .search { position:relative; margin-bottom:10px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
    .search input { width:100%; padding:10px 62px 10px 11px; border:1px solid var(--control); border-radius:var(--radius-control, 10px); background:var(--panel); color:var(--text); font:inherit; }
    .search input::placeholder { color:var(--muted); opacity:1; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .search input:focus-visible { border-color:var(--accent); }
    .key { position:absolute; right:11px; top:11px; color:var(--muted); font-size:11px; line-height:1.5; pointer-events:none; }
    .search input:not(:placeholder-shown) + .key { display:none; }
    #results { display:grid; gap:7px; max-height:148px; overflow:auto; padding:4px; margin:0 -4px; scroll-padding-block:32px; scrollbar-width:thin; scrollbar-color:var(--control) var(--bg); }
    .result { min-width:0; width:100%; text-align:left; border:1px solid var(--line); border-radius:var(--radius-panel, 10px); padding:9px 10px; background:var(--panel); color:var(--text); font:inherit; cursor:pointer; }
    .result:hover { border-color:var(--accent); background:var(--soft); }
    .result:active { background:var(--pressed); }
    .result-head { display:flex; min-width:0; justify-content:space-between; gap:8px; align-items:center; }
    .trigger { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:700 12px/1.4 var(--mono, ui-monospace,SFMono-Regular,Menlo,monospace); color:var(--accent); }
    .copy { flex:none; color:var(--muted); font-size:11px; }
    .expansion { margin-top:4px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .empty { color:var(--muted); text-align:center; padding:26px 12px; border:1px dashed var(--control); border-radius:var(--radius-panel, 10px); background:var(--panel); }
    .divider { height:1px; background:var(--line); margin:10px 0 12px; }
    .toggles { display:grid; gap:12px; }
    .toggles label { display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; }
    .toggles label > span { min-width:0; font-weight:600; }
    .toggles input { flex:none; width:17px; height:17px; margin:0 2px 0 0; accent-color:var(--toggle, #2357d7); cursor:pointer; }
    .toggles label:has(input:disabled), .toggles input:disabled { cursor:default; color:var(--muted); }
    .toggles select { flex:none; max-width:150px; min-height:32px; padding:4px 8px; border:1px solid var(--control); border-radius:var(--radius-control, 8px); background:var(--panel); color:var(--text); font:inherit; cursor:pointer; }
    .toggles select:hover { border-color:var(--accent); }
    .toggles select:disabled { cursor:wait; color:var(--muted); }
    #themeNote { white-space:normal; }
    .sub { display:block; color:var(--muted); font-size:11px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:16px; }
    .muted { color:var(--muted); font-size:11px; }
    button.link { border:1px solid var(--control); border-radius:var(--radius-control, 8px); padding:8px 10px; background:var(--panel); color:var(--accent); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; }
    button.link:hover { border-color:var(--accent); background:var(--soft); }
    button.link:active { background:var(--pressed); }
    #toast { min-height:18px; margin-top:8px; color:var(--accent); font-size:11px; overflow-wrap:anywhere; }
    .premium-compact { margin-top:14px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-panel, 10px); background:var(--soft); }
    .premium-heading { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    #premiumPlan { margin:0; color:var(--accent); font-size:11px; font-weight:750; }
    #premiumUsage { font-size:12px; font-weight:750; }
    #premiumHint, #premiumReset { margin:5px 0 0; color:var(--muted); font-size:11px; }
    #premiumReset { font-size:10px; }
    #premiumProgress { appearance:none; display:block; width:100%; height:5px; margin-top:8px; border:0; border-radius:6px; overflow:hidden; background:var(--panel); color:var(--accent); }
    #premiumProgress::-webkit-progress-bar { background:var(--panel); border-radius:6px; }
    #premiumProgress::-webkit-progress-value { background:var(--accent); border-radius:6px; }
    #premiumProgress::-moz-progress-bar { background:var(--accent); border-radius:6px; }
    #premiumMsg { margin:7px 0 0; color:var(--accent); font-size:11px; overflow-wrap:anywhere; }
    #premiumMsg:empty { display:none; }
    #premiumMsg[data-error="true"] { color:var(--danger); }
    @media (prefers-color-scheme: dark) { .toggles input { accent-color:var(--toggle, #315ccc); } }
    @media (forced-colors: active) { :focus-visible { outline-color:Highlight; } .result, .status, button.link { border:1px solid ButtonText; } }
  </style>
  <link rel="stylesheet" href="brand.css">
</head>
<body>
  <div class="popup-content">
  <div class="top">
    <div class="brand">
      <img src="../icons/icon48.png" width="32" height="32" alt="">
      <div><h1 class="sr-only">actle</h1><button class="actle-brand" type="button" data-actle-brand aria-label="actle — autocompletes to autocompletele. Replay logo animation" title="actle → autocompletele"><span class="actle-brand__word" aria-hidden="true">actle</span></button><p class="tagline">A little goes a long way.</p></div>
    </div>
    <span class="status" id="status">Ready</span>
  </div>

  <div class="search">
    <label class="sr-only" for="search">Search shorthands</label>
    <input id="search" type="search" placeholder="Find a shorthand…" autocomplete="off" autofocus>
    <span class="key" aria-hidden="true">↵ copy</span>
  </div>
  <div id="results" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <div class="divider"></div>

  <div class="toggles">
    <label>
      <span>Expansion <small class="sub">Across this browser</small></span>
      <input type="checkbox" id="enabled">
    </label>
    <label>
      <span>This site <small class="sub" id="host">Current page</small></span>
      <input type="checkbox" id="site">
    </label>
    <label>
      <span>Style <small class="sub" id="themeNote">Classic</small></span>
      <select id="theme"></select>
    </label>
  </div>

  <section class="premium-compact" id="premium" aria-labelledby="premiumPlan" data-compact>
    <div class="premium-heading"><h2 id="premiumPlan">Checking your plan…</h2><span id="premiumUsage">—</span></div>
    <progress id="premiumProgress" max="100" value="0" aria-label="Daily auto completes used" hidden></progress>
    <p id="premiumHint">Loading today's usage.</p>
    <p id="premiumReset">Daily count resets at local midnight.</p>
    <p id="premiumMsg" role="status"></p>
  </section>

  <div class="footer">
    <span class="muted" id="count"></span>
    <button class="link" id="options">Library & plans →</button>
  </div>

  </div>
  <script src="brand.js"></script>
  <script src="themes.js"></script>
  <script src="expander.js"></script>
  <script src="template.js"></script>
  <script src="template-form.js"></script>
  <script src="storage.js"></script>
  <script src="palette.js"></script>
  <script src="premium-config.js"></script>
  <script src="premium-client.js"></script>
  <script src="premium-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
