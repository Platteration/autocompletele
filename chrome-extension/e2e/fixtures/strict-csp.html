<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- As strict as a page can reasonably be. Many real sites ship something
       close to this, and the overlay has to survive it. Note there is no
       inline style anywhere below: any CSP violation the test sees is ours. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'none'; script-src 'none'; img-src 'none'">
  <title>Strict CSP fixture</title>
</head>
<body>
  <input id="inp" type="text">
</body>
</html>
